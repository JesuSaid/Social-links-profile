<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <title>Social links profile</title>
</head>
<body>
  <main class="profile">
    <img class="profile-avatar" src="./assets/images/avatar-jessica.jpeg" alt="Profile photo of Jessica, looking serious with curly hair, with an office background.">
    <h1 class="profile-name">Jessica Randall</h1>
    <p class="profile-location">CDMX, México</p>
    <p class="profile-description">"Front-end developer and avid reader."</p>
    <div class="links">
      <a class="item" href="https://github.com/?locale=es-419">GitHub</a>
      <a class="item" href="https://www.frontendmentor.io/">Frontend Mentor</a>
      <a class="item" href="https://www.linkedin.com/">LinkedIn</a>
      <a class="item" href="https://x.com/?lang=es">Twitter</a>
      <a class="item" href="https://www.instagram.com/?hl=es">Instagram</a>
    </div>
  </main> 
</body>
</html>
